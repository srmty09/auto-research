<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Research</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="auth-page" class="page active">
    <div class="auth-card">
      <h1>Auto Research</h1>
      <p class="subtitle">Autonomous Research Agent</p>
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Login</button>
        <button class="auth-tab" data-tab="register">Register</button>
      </div>
      <form id="login-form" class="auth-form active">
        <input type="text" id="login-username" placeholder="Username" required autocomplete="username">
        <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password">
        <button type="submit">Login</button>
        <p class="auth-error" id="login-error"></p>
      </form>
      <form id="register-form" class="auth-form">
        <input type="text" id="register-username" placeholder="Username" required autocomplete="username">
        <input type="password" id="register-password" placeholder="Password" required autocomplete="new-password">
        <button type="submit">Register</button>
        <p class="auth-error" id="register-error"></p>
      </form>
    </div>
  </div>

  <div id="main-page" class="page">
    <aside id="sidebar">
      <div class="sidebar-header">
        <h2>Auto Research</h2>
        <button id="new-chat-btn" title="New Chat">+</button>
      </div>
      <div class="user-info">
        <span id="username-display"></span>
        <button id="logout-btn">Logout</button>
      </div>
      <div class="sidebar-section">
        <h3>Sessions</h3>
        <div id="session-list"></div>
      </div>
    </aside>

    <main id="chat-area">
      <div id="chat-messages">
        <div class="empty-state" id="empty-state">
          <h2>Auto Research</h2>
          <p>Ask anything — I'll research, run code, and produce structured results.</p>
          <div class="examples">
            <button class="example-btn" data-goal="What is the current population of Japan?">Population of Japan</button>
            <button class="example-btn" data-goal="Research the current CEO of NVIDIA and write their biography">CEO of NVIDIA</button>
            <button class="example-btn" data-goal="Calculate 15% of 8472">Calculate 15% of 8472</button>
          </div>
        </div>
      </div>
      <div id="chat-input-area">
        <div id="model-bar">
          <select id="model-select"></select>
        </div>
        <div id="input-row">
          <textarea id="chat-input" placeholder="Ask anything..." rows="1"></textarea>
          <button id="send-btn">Send</button>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
